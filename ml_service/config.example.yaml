# ML Trading Intelligence System Configuration

# Data Sources
data_sources:
  binance:
    enabled: true
    api_key: "YOUR_BINANCE_API_KEY_HERE"
    api_secret: "YOUR_BINANCE_API_SECRET_HERE"
    symbols:
      - BTCUSDT
      - ETHUSDT
      - BNBUSDT
      - SOLUSDT

  yfinance:
    enabled: true
    symbols:
      - SPY    # S&P 500 ETF (proxy for ES futures)
      - QQQ    # Nasdaq 100 ETF (proxy for NQ futures)
      - GLD    # Gold ETF
      - USO    # Oil ETF
      - TLT    # Treasury ETF

# Timeframes to fetch and analyze
timeframes:
  - 1m
  - 5m
  - 15m
  - 1h
  - 4h
  - 1d

# Feature Engineering
features:
  price_action:
    swing_lookback: 20
    support_resistance_periods: [20, 50, 100]

  indicators:
    ema_periods: [9, 20, 50, 200]
    rsi_period: 14
    atr_period: 14
    macd: [12, 26, 9]
    bollinger_bands: [20, 2]

  regime:
    volatility_window: 20
    trend_window: 50

# ML Model Configuration
model:
  type: "xgboost"  # xgboost or lightgbm
  target: "forward_return"  # forward_return or binary_signal
  forward_periods: 10  # predict N candles ahead

  train_test_split: 0.8
  validation_method: "walk_forward"

  xgboost_params:
    max_depth: 6
    learning_rate: 0.1
    n_estimators: 100
    objective: "reg:squarederror"

  lightgbm_params:
    max_depth: 6
    learning_rate: 0.1
    n_estimators: 100
    objective: "regression"

# Backtesting
backtest:
  initial_capital: 10000
  position_size: 0.1  # 10% of capital per trade
  commission: 0.001   # 0.1%
  slippage: 0.0005    # 0.05%

# API Configuration
api:
  host: "127.0.0.1"
  port: 8000
  reload: true

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "storage/logs/ml_service.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

# Economic Calendar API (free tier)
economic_calendar:
  provider: "financialmodelingprep"  # or "manual_csv"
  api_key: "YOUR_FMP_API_KEY"  # Get free key from financialmodelingprep.com
  events_to_track:
    - FOMC
    - CPI
    - NFP
    - GDP
    - Unemployment
    - Interest Rate Decision
